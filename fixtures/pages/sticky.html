<!doctype html>
<!--
  B13. A full-page screenshot paints a fixed element once, at the top, so the
  picture alone says it scrolls away with everything else — which is how
  duolingo's fixed header was reported as "no sticky version reappears".

  The important case is #site-header: the thing that is fixed is a plain <div>
  that our selector never captures, and the <nav> inside it computes
  `position: static`. That is duolingo's actual shape, and the first version of
  this fixture did not have it — it put `position: fixed` straight onto the
  <header>, which every implementation passes, including the broken one.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sticky fixture</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #site-header { position: fixed; top: 0; width: 100%; height: 60px; background: #eee; }
      #sub-nav { position: sticky; top: 60px; height: 40px; background: #ddd; }
      #banner { position: static; height: 40px; background: #ccc; }
      main { height: 3000px; padding-top: 100px; }
    </style>
  </head>
  <body>
    <div id="site-header">
      <nav><a href="/">Home</a></nav>
    </div>
    <header id="sub-nav"><a href="#one">Section one</a></header>
    <div id="banner"><a href="#two">Announcement</a></div>
    <main>
      <h1>A long page</h1>
      <p>Scrolls far enough that a fixed header matters.</p>
      <a href="#three">A link near the bottom</a>
    </main>
  </body>
</html>
